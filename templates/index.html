{% extends "base.html" %}

{% block content %}
<div class="container text-center">
    <h1 class="main-title mb-4">Eldi's Chord Finder 🎸</h1>
    
    <div class="upload-section mb-4">
        <!-- Upload Form -->
        <div id="upload-form">
            <div class="upload-area mb-4">
                <input type="file" class="file-input" id="file-upload" accept=".mp3">
                <div class="upload-content">
                    <i class="fas fa-music upload-icon"></i>
                    <p class="upload-text">Drop your MP3 here or click to browse</p>
                    <p class="upload-hint">Drag and drop or click to select</p>
                </div>
            </div>
            <button type="button" id="analyze-btn" class="btn btn-primary" disabled>
                <i class="fas fa-wand-magic-sparkles me-2"></i>Analyze
            </button>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Analyzing chords...</p>
    </div>

    <!-- Results -->
    <div id="results-container" class="d-none">
        <!-- Controls Section -->
        <div class="controls-section mb-4">
            <button id="playBtn" class="btn btn-primary btn-lg me-2">
                <i class="fas fa-play"></i>
            </button>
            <button id="uploadMoreBtn" class="btn btn-outline-light btn-lg">
                <i class="fas fa-upload"></i>
            </button>
        </div>

        <!-- Current Chord Display -->
        <div id="current-chord-display" class="mb-4">
            <div class="current-chord-box">
                <div class="transpose-controls">
                    <button class="transpose-btn transpose-down">
                        <i class="fas fa-minus"></i>
                    </button>
                    <button class="transpose-btn transpose-up">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="current-chord-value"></div>
                <span class="current-time-value"></span>
            </div>
        </div>
        
        <!-- Chord Sequence -->
        <div id="chord-sequence" class="mb-4">
            <div class="chord-timeline custom-scrollbar"></div>
        </div>
        
        <!-- Waveform -->
        <div class="result-box">
            <div id="waveform"></div>
        </div>
        
        <!-- Error Display -->
        <div id="error-message" class="alert alert-danger d-none"></div>
    </div>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="footer-content">
            <p>By <a href="https://www.linkedin.com/in/eldad-eliyahu-levi/" class="text-white text-decoration-none">Eldad Levi</a> | <span class="text-footer">Bring Them Home.</span> 🎗️</p>
        </div>
    </footer>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const uploadSection = document.querySelector('.upload-section');
    const uploadForm = document.getElementById('upload-form');
    const analyzeBtn = document.getElementById('analyze-btn');
    const uploadMoreBtn = document.getElementById('uploadMoreBtn');
    const fileInput = document.getElementById('file-upload');
    const loader = document.getElementById('loader');
    const resultsContainer = document.getElementById('results-container');
    const errorMessage = document.getElementById('error-message');
    const playBtn = document.getElementById('playBtn');
    const currentChordValue = document.querySelector('.current-chord-value');
    const currentTimeValue = document.querySelector('.current-time-value');
    const currentChordBox = document.querySelector('.current-chord-box');
    let chordSequence = [];
    let lastChordIndex = -1;
    
    // Audio Analysis setup
    let audioContext;
    let analyser;
    let dataArray;
    const smoothingTimeConstant = 0.8;
    const fftSize = 2048;

    // Initialize WaveSurfer with audioContext
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: 'rgba(255, 255, 255, 0.3)',
        progressColor: 'rgba(0, 123, 255, 0.6)',
        cursorColor: '#fff',
        barWidth: 3,
        barRadius: 3,
        cursorWidth: 1,
        height: 100,
        barGap: 3,
        backend: 'WebAudio'
    });

    // Set up audio analysis when audio is loaded
    wavesurfer.on('ready', function() {
        if (!audioContext) {
            audioContext = wavesurfer.backend.ac;
            analyser = audioContext.createAnalyser();
            analyser.smoothingTimeConstant = smoothingTimeConstant;
            analyser.fftSize = fftSize;
            
            wavesurfer.backend.setFilter(analyser);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            // Start the animation loop
            requestAnimationFrame(analyzeAudio);
        }
    });

    function analyzeAudio() {
        if (wavesurfer.isPlaying()) {
            analyser.getByteFrequencyData(dataArray);
            
            // Calculate average volume
            const average = dataArray.reduce((acc, val) => acc + val, 0) / dataArray.length;
            const normalizedValue = average / 256; // Normalize to 0-1 range
            
            // Apply scale transform based on volume
            const baseScale = 1;
            const maxScale = 1.1;
            const scale = baseScale + (normalizedValue * (maxScale - baseScale));
            
            // Calculate text scale based on volume (more dramatic)
            const baseTextScale = 1;
            const maxTextScale = 1.4; // More dramatic scale for text
            const textScale = baseTextScale + (normalizedValue * (maxTextScale - baseTextScale));
            
            // Apply transforms
            currentChordBox.style.transform = `scale(${scale}) perspective(1000px) rotateX(${normalizedValue * 8}deg) rotateY(${normalizedValue * 8}deg)`;
            
            // Apply text transforms while preserving the floating animation
            const baseTransform = getComputedStyle(currentChordValue).transform;
            currentChordValue.style.transform = `scale(${textScale}) perspective(1000px) 
                rotateX(${10 + normalizedValue * 15}deg) 
                rotateY(${-10 + normalizedValue * 15}deg) 
                rotateZ(${2 + normalizedValue * 5}deg)`;
            
            // Update glow intensity
            const glowIntensity = Math.floor(normalizedValue * 50);
            const glowColor = `rgba(0, 123, 255, ${normalizedValue * 0.5})`;
            currentChordBox.style.boxShadow = `
                0 0 ${glowIntensity}px ${glowColor},
                0 ${8 + normalizedValue * 16}px ${32 + normalizedValue * 32}px rgba(0, 0, 0, 0.2)
            `;
            
            // Update text shadow based on volume
            const textGlow = Math.floor(normalizedValue * 30);
            currentChordValue.style.textShadow = `
                0 0 ${textGlow}px rgba(255,255,255,0.6),
                ${1 + normalizedValue * 2}px ${1 + normalizedValue * 2}px 0 rgba(0,123,255,0.2),
                ${2 + normalizedValue * 4}px ${2 + normalizedValue * 4}px 0 rgba(0,123,255,0.1),
                ${3 + normalizedValue * 6}px ${3 + normalizedValue * 6}px 0 rgba(0,123,255,0.05)
            `;

            // Update background effects based on volume
            document.body.style.setProperty('--rotation', `${normalizedValue * 360}deg`);
            document.body.style.setProperty('--scale', 1 + normalizedValue * 0.1);
            document.body.style.setProperty('--smoke-offset', `${-30 - normalizedValue * 20}%`);
            document.body.style.setProperty('--glow-opacity', 0.4 + normalizedValue * 0.2);
        }
        
        requestAnimationFrame(analyzeAudio);
    }

    // Playback controls
    playBtn.addEventListener('click', function() {
        if (wavesurfer.isPlaying()) {
            wavesurfer.pause();
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            currentChordBox.classList.remove('playing');
            stopGeneratingNotes();
        } else {
            wavesurfer.play();
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            currentChordBox.classList.add('playing');
            startGeneratingNotes();
        }
    });

    // Update current chord during playback
    wavesurfer.on('audioprocess', function(currentTime) {
        requestAnimationFrame(() => {
            updateCurrentChord(currentTime);
        });
    });

    wavesurfer.on('finish', function() {
        playBtn.innerHTML = '<i class="fas fa-play"></i> Play';
        clearActiveChords();
        currentChordValue.textContent = '';
        currentTimeValue.textContent = '';
        lastChordIndex = -1;
        currentChordBox.classList.remove('playing');
        // Reset transform and glow
        currentChordBox.style.transform = 'scale(1)';
        currentChordBox.style.boxShadow = '0 8px 32px rgba(0, 0, 0, 0.2)';
    });

    // Handle file analysis
    analyzeBtn.addEventListener('click', async function() {
        const file = fileInput.files[0];
        if (!file) return;
        
        // Reset UI
        errorMessage.classList.add('d-none');
        resultsContainer.classList.add('d-none');
        loader.classList.remove('d-none');
        uploadSection.style.display = 'none';  // Hide entire upload section
        lastChordIndex = -1;
        
        const formData = new FormData();
        formData.append('file', file);
        
        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error || 'Upload failed');
            }
            
            // Parse and store chord sequence
            chordSequence = data.chord_sequence.map(item => {
                const chord = parseChordData(item.chord);
                return {
                    startTime: chord.startTime,
                    endTime: chord.endTime,
                    root: chord.root,
                    type: chord.type
                };
            });
            
            // Display results
            displayResults(chordSequence, file);
            
        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.classList.remove('d-none');
            uploadSection.style.display = 'block';  // Show upload section on error
        } finally {
            loader.classList.add('d-none');
        }
    });

    // Handle "Upload More" button
    uploadMoreBtn.addEventListener('click', function() {
        uploadSection.style.display = 'block';  // Show entire upload section
        resultsContainer.classList.add('d-none');
        fileInput.value = '';
    });

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
    }

    function parseChordData(chordStr) {
        const match = chordStr.match(/\(([\d.]+),\s*([\d.]+),\s*'([^']+)'\)/);
        if (match) {
            const chordParts = match[3].split(':');
            return {
                startTime: parseFloat(match[1]),
                endTime: parseFloat(match[2]),
                root: chordParts[0],
                type: chordParts[1] || 'maj'
            };
        }
        return null;
    }

    function formatChordType(type) {
        switch(type.toLowerCase()) {
            case 'maj': return '';  // major is default, no symbol needed
            case 'min': return 'm';
            case 'dim': return '°';
            case '7': return '7';
            case 'maj7': return 'maj7';
            case 'min7': return 'm7';
            default: return type;
        }
    }

    // Add after existing variables
    const TRANSITION_DURATION = 300; // matches CSS transition duration in ms

    function updateCurrentChord(currentTime) {
        const currentChord = findCurrentChord(currentTime);
        if (!currentChord) return;

        const currentIndex = chordSequence.findIndex(chord => 
            currentTime >= chord.startTime && currentTime < chord.endTime
        );

        // Update current chord if it changed
        if (currentIndex !== lastChordIndex) {
            // Get the chord text from the active marker instead of generating it
            const chordElements = document.querySelectorAll('.chord-marker');
            if (currentIndex >= 0 && chordElements[currentIndex]) {
                const element = chordElements[currentIndex];
                const markerChordText = element.childNodes[0].textContent.trim();
                currentChordValue.textContent = markerChordText;
                currentTimeValue.textContent = `(${formatTime(currentTime)})`;
                
                // Update highlighted chord in the sequence
                clearActiveChords();
                element.classList.add('active');
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            lastChordIndex = currentIndex;
        } else {
            // Just update the time
            currentTimeValue.textContent = `(${formatTime(currentTime)})`;
        }
    }

    function findCurrentChord(currentTime) {
        return chordSequence.find(chord => 
            currentTime >= chord.startTime && currentTime < chord.endTime
        );
    }

    function clearActiveChords() {
        document.querySelectorAll('.chord-marker').forEach(marker => {
            marker.classList.remove('active');
        });
    }

    let currentFileName = '';

    function displayResults(chords, file) {
        // Reset transposition when loading new file
        currentTransposition = 0;
        updateTransposeIndicator();
        
        // Remove previous file info display if exists
        const existingFileInfo = document.querySelector('.file-info-display');
        if (existingFileInfo) {
            existingFileInfo.remove();
        }

        // Update file info
        currentFileName = file.name;
        const fileInfoDisplay = document.createElement('div');
        fileInfoDisplay.className = 'file-info-display';
        document.querySelector('.main-title').after(fileInfoDisplay);
        
        // Add with opacity 0 first
        fileInfoDisplay.style.opacity = '0';
        fileInfoDisplay.innerHTML = `
            <span class="file-name">${currentFileName}</span>
        `;
        
        // Trigger reflow and animate in
        requestAnimationFrame(() => {
            fileInfoDisplay.style.opacity = '1';
        });

        // Reset wavesurfer and load new file
        wavesurfer.stop();
        wavesurfer.loadBlob(file);
        
        // Reset play button state
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        
        // Display chord sequence
        const timeline = document.querySelector('.chord-timeline');
        timeline.innerHTML = '';
        
        chords.forEach((item, index) => {
            const marker = document.createElement('div');
            marker.className = 'chord-marker';
            let displayChord = `${item.root}${formatChordType(item.type)}`;
            if (displayChord === 'N') displayChord = '🎵';
            marker.innerHTML = `
                ${displayChord}
                <span class="time-indicator">${formatTime(item.startTime)}</span>
            `;
            
            marker.addEventListener('click', () => {
                wavesurfer.play(item.startTime);
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                currentChordBox.classList.add('playing');
                clearActiveChords();
                marker.classList.add('active');
            });
            
            timeline.appendChild(marker);
        });
        
        // Show results container first
        resultsContainer.classList.remove('d-none');
        
        // Reset states
        currentChordValue.textContent = '';
        currentTimeValue.textContent = '';
        currentChordBox.classList.remove('playing');
        currentChordBox.style.transform = 'scale(1)';
        currentChordBox.style.boxShadow = '0 8px 32px rgba(0, 0, 0, 0.2)';
        
        // Reset last chord index
        lastChordIndex = -1;
    }

    const uploadArea = document.querySelector('.upload-area');
    const uploadContent = document.querySelector('.upload-content');
    const uploadText = document.querySelector('.upload-text');
    const uploadHint = document.querySelector('.upload-hint');

    // File drag and drop handling
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        uploadArea.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, unhighlight, false);
    });

    uploadArea.addEventListener('drop', handleDrop, false);
    uploadArea.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            handleFiles(this.files);
        }
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    function highlight(e) {
        uploadArea.classList.add('highlight');
    }

    function unhighlight(e) {
        uploadArea.classList.remove('highlight');
    }

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
    }

    function handleFiles(files) {
        if (files[0].type !== 'audio/mpeg') {
            uploadText.textContent = 'Please select an MP3 file';
            uploadHint.textContent = 'Only MP3 files are supported';
            uploadArea.classList.add('error');
            analyzeBtn.disabled = true;
            return;
        }

        uploadText.textContent = files[0].name;
        uploadHint.textContent = 'File ready for analysis';
        uploadArea.classList.remove('error');
        uploadArea.classList.add('success');
        analyzeBtn.disabled = false;
    }

    // Add after the existing variables
    const musicEmojis = ['🎵', '🎶', '♪', '♫'];
    const floatingNotes = new Set();
    let isGeneratingNotes = false;
    let animationFrameId = null;

    function createFloatingNote() {
        const note = document.createElement('div');
        note.className = 'floating-note';
        note.textContent = musicEmojis[Math.floor(Math.random() * musicEmojis.length)];
        
        // Random starting position at bottom
        const startX = Math.random() * (window.innerWidth - 40);
        const startY = window.innerHeight - Math.random() * 20;
        
        // Random properties for animation
        const speed = 0.8 + Math.random() * 0.4; // Speed multiplier
        const sway = 30 + Math.random() * 40; // Max sway distance in pixels
        const swaySpeed = 1 + Math.random() * 2; // Sway speed multiplier
        const rotationRange = 15 + Math.random() * 25; // Max rotation in degrees
        const scaleRange = 0.3 + Math.random() * 0.4; // Scale variation
        
        note.style.cssText = `
            position: fixed;
            left: ${startX}px;
            top: ${startY}px;
            font-size: 24px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.5s ease;
        `;
        
        document.body.appendChild(note);
        requestAnimationFrame(() => note.style.opacity = '0.7');
        
        let time = 0;
        let initialY = startY;
        let lifeTime = 0;
        const maxLifeTime = 10; // 10 seconds lifetime
        
        function updatePosition() {
            if (!document.body.contains(note)) return;
            
            time += 0.016; // Approximately 60fps
            lifeTime += 0.016;
            
            // Start fading out at 9 seconds (1 second fade)
            if (lifeTime >= maxLifeTime - 1) {
                const fadeProgress = (maxLifeTime - lifeTime);
                note.style.opacity = Math.max(0, fadeProgress * 0.7);
                
                if (lifeTime >= maxLifeTime) {
                    note.remove();
                    floatingNotes.delete(note);
                    return;
                }
            }
            
            // Vertical movement (float up)
            const newY = initialY - (time * 50 * speed);
            
            // Horizontal sway
            const swayX = Math.sin(time * swaySpeed) * sway;
            
            // Rotation
            const rotation = Math.sin(time * swaySpeed * 1.2) * rotationRange;
            
            // Scale oscillation
            const scale = 1 + Math.sin(time * swaySpeed * 0.8) * scaleRange;
            
            note.style.transform = `
                translate(${swayX}px, ${newY - initialY}px)
                rotate(${rotation}deg)
                scale(${scale})
            `;
            
            requestAnimationFrame(updatePosition);
        }
        
        floatingNotes.add(note);
        requestAnimationFrame(updatePosition);
    }

    function startGeneratingNotes() {
        if (isGeneratingNotes) return;
        isGeneratingNotes = true;
        
        function generateNote() {
            if (!isGeneratingNotes) return;
            createFloatingNote();
            setTimeout(generateNote, 800 + Math.random() * 1200); // Random interval between notes
        }
        
        generateNote();
    }

    function stopGeneratingNotes() {
        isGeneratingNotes = false;
        
        // Fade out existing notes
        floatingNotes.forEach(note => {
            note.style.transition = 'opacity 2s ease';
            note.style.opacity = '0';
            setTimeout(() => note.remove(), 2000);
        });
    }

    // Add after the existing variables
    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    let currentTransposition = 0;

    // Add the transposition indicator HTML
    const transposeIndicator = document.createElement('div');
    transposeIndicator.className = 'transpose-indicator';
    transposeIndicator.innerHTML = `
        <span class="transpose-text">Transposed: <strong>0</strong> semitones</span>
        <button class="reset-btn">Reset</button>
    `;
    document.body.appendChild(transposeIndicator);

    function updateTransposeIndicator() {
        const indicator = document.querySelector('.transpose-indicator');
        const transposeText = indicator.querySelector('strong');
        
        if (currentTransposition === 0) {
            indicator.classList.remove('visible');
        } else {
            transposeText.textContent = currentTransposition;
            indicator.classList.add('visible');
        }
    }

    function setupTransposeButtons() {
        const transposeDownBtn = document.querySelector('.transpose-down');
        const transposeUpBtn = document.querySelector('.transpose-up');
        const resetBtn = document.querySelector('.transpose-indicator .reset-btn');
        
        transposeDownBtn.addEventListener('click', () => transposeChords(-1));
        transposeUpBtn.addEventListener('click', () => transposeChords(1));
        resetBtn.addEventListener('click', resetTransposition);
    }

    function resetTransposition() {
        if (currentTransposition === 0) return;
        
        const oldTransposition = currentTransposition;
        currentTransposition = 0;
        
        // Transpose back by the negative of current transposition
        updateAllChords(-oldTransposition);
        updateTransposeIndicator();
    }

    function transposeChords(semitones) {
        currentTransposition = (currentTransposition + semitones) % 12;
        if (currentTransposition < 0) currentTransposition += 12;

        updateAllChords(semitones);
        updateTransposeIndicator();
    }

    function updateAllChords(semitones) {
        try {
            // Update all chord markers
            document.querySelectorAll('.chord-marker').forEach(marker => {
                const textNode = marker.childNodes[0];
                const chordText = textNode.textContent.trim();
                if (chordText && chordText !== '🎵') {
                    const transposed = transposeChord(chordText, semitones);
                    if (transposed) textNode.textContent = transposed;
                }
            });

            // Update current chord display
            const currentChord = currentChordValue.textContent;
            if (currentChord && currentChord !== '🎵') {
                const transposed = transposeChord(currentChord, semitones);
                if (transposed) currentChordValue.textContent = transposed;
            }
        } catch (error) {
            console.error('Transposition error:', error);
        }
    }

    function transposeChord(chord, semitones) {
        try {
            // Extract root note and the rest of the chord
            const match = chord.match(/^([A-G]#?)(.*)$/);
            if (!match) return null;

            const [_, root, quality] = match;
            const noteIndex = notes.indexOf(root);
            if (noteIndex === -1) return null;

            // Calculate new root note
            let newIndex = noteIndex + semitones;
            // Ensure the index wraps around properly
            newIndex = ((newIndex % 12) + 12) % 12;
            
            return notes[newIndex] + quality;
        } catch (error) {
            console.error('Error transposing chord:', chord, error);
            return null;
        }
    }

    // Call setup after DOM is loaded
    setupTransposeButtons();
});
</script>
{% endblock %}
