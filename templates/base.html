<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}anysong.ai - simple chords, any song.{% endblock %}</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4V2V3FYXPG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-4V2V3FYXPG');
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Share Modal -->
    <div id="shareModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Share ANYSONG.AI</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="share-url-container mb-4">
                        <div class="share-url-box">
                            <input type="text" disabled value="http://anysong.ai" readonly class="share-url-input">
                            <button class="copy-url-btn">
                                <i class="far fa-copy"></i>
                            </button>
                        </div>
                    </div>
                    <div class="share-buttons">
                        <button class="share-social-btn twitter">
                            <i class="fab fa-twitter"></i>
                            Twitter
                        </button>
                        <button class="share-social-btn facebook">
                            <i class="fab fa-facebook"></i>
                            Facebook
                        </button>
                        <button class="share-social-btn linkedin">
                            <i class="fab fa-linkedin"></i>
                            LinkedIn
                        </button>
                        <button class="share-social-btn whatsapp">
                            <i class="fab fa-whatsapp"></i>
                            WhatsApp
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Wavesurfer.js -->
    <script src="https://unpkg.com/wavesurfer.js@6.1.0/dist/wavesurfer.js"></script>
    
    <script>
        // Background Canvas Animation
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');
        const musicEmojis = ['🎵', '🎶', '♪', '♫'];
        const notes = [];
        let animationFrameId = null;

        // Resize canvas to full window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Note {
            constructor(isInitial = false) {
                this.reset();
                if (isInitial) {
                    // For initial notes, distribute them across the screen
                    this.y = Math.random() * canvas.height;
                    this.opacity = 0;
                } else {
                    // New notes always start from bottom
                    this.y = canvas.height + 20;
                    this.opacity = 0;
                }
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.speed = 0.8 + Math.random() * 0.6;
                this.sway = 40 + Math.random() * 60;
                this.swaySpeed = 0.8 + Math.random() * 1.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (-1 + Math.random() * 2) * 1.2;
                this.scale = 0.8 + Math.random() * 0.6;
                this.opacity = 0;
                this.text = musicEmojis[Math.floor(Math.random() * musicEmojis.length)];
                this.time = Math.random() * 1000;
                this.glowIntensity = 0.5 + Math.random() * 0.5;
                this.pulseSpeed = 0.5 + Math.random() * 0.5;
            }

            update() {
                this.time += 0.016;
                this.y -= this.speed;
                this.x += Math.sin(this.time * this.swaySpeed) * 0.5;
                this.rotation += this.rotationSpeed;

                const scalePulse = Math.sin(this.time * this.pulseSpeed) * 0.1;
                this.currentScale = this.scale * (1 + scalePulse);

                // Slower fade in
                if (this.opacity < 0.7) {
                    this.opacity += 0.01; // Reduced from 0.02 to 0.01 for gentler fade
                }

                if (this.y < -50) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.scale(this.currentScale, this.currentScale);

                // Add glow effect
                ctx.shadowBlur = 15 * this.glowIntensity;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                ctx.globalAlpha = this.opacity;

                // Main text
                ctx.font = '32px Arial'; // Bigger font
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; // Brighter white
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, 0, 0);

                // Add subtle color overlay
                ctx.globalAlpha = this.opacity * 0.3;
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
                gradient.addColorStop(0, 'rgba(135, 206, 235, 0.8)'); // Sky blue
                gradient.addColorStop(1, 'rgba(70, 130, 180, 0)'); // Steel blue
                ctx.fillStyle = gradient;
                ctx.fillText(this.text, 0, 0);

                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            notes.forEach(note => {
                note.update();
                note.draw();
            });

            animationFrameId = requestAnimationFrame(animate);
        }

        // Initialize notes and start animation
        function initializeNotes() {
            // Start animation first
            animate();

            // Add initial notes very gradually
            let addedNotes = 0;
            const addNote = () => {
                if (addedNotes < 5) {
                    // Initial notes distributed across screen
                    const note = new Note(true);
                    notes.push(note);
                    addedNotes++;
                    setTimeout(addNote, 500); // Add initial notes every 500ms
                } else {
                    // After initial notes, start the regular spawning
                    setInterval(() => {
                        if (notes.length < 40 && Math.random() < 0.1) { // Reduced spawn chance
                            const note = new Note(false);
                            notes.push(note);
                        }
                    }, 2000); // Increased interval between spawns
                }
            };

            // Start adding notes
            setTimeout(addNote, 1000); // Start first note after 1 second
        }

        // Start the animation immediately
        initializeNotes();
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
