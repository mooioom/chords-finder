<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}Eldi's Simple Chords Finder{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Wavesurfer.js -->
    <script src="https://unpkg.com/wavesurfer.js@6.1.0/dist/wavesurfer.js"></script>
    
    <script>
        // Background Canvas Animation
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');
        const musicEmojis = ['🎵', '🎶', '♪', '♫'];
        const notes = [];
        let animationFrameId = null;

        // Resize canvas to full window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Note {
            constructor() {
                this.reset();
                this.y = canvas.height + Math.random() * 20; // Start from bottom
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.speed = 0.8 + Math.random() * 0.6; // Faster movement
                this.sway = 40 + Math.random() * 60; // More sway
                this.swaySpeed = 0.8 + Math.random() * 1.5; // More dynamic sway
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (-1 + Math.random() * 2) * 1.2; // More rotation
                this.scale = 0.8 + Math.random() * 0.6; // Bigger notes (0.8-1.4)
                this.opacity = 0;
                this.text = musicEmojis[Math.floor(Math.random() * musicEmojis.length)];
                this.time = Math.random() * 1000;
                this.glowIntensity = 0.5 + Math.random() * 0.5; // Random glow intensity
                this.pulseSpeed = 0.5 + Math.random() * 0.5; // Random pulse speed
            }

            update() {
                this.time += 0.016;
                this.y -= this.speed;
                this.x += Math.sin(this.time * this.swaySpeed) * 0.5;
                this.rotation += this.rotationSpeed;

                // Pulsing scale effect
                const scalePulse = Math.sin(this.time * this.pulseSpeed) * 0.1;
                this.currentScale = this.scale * (1 + scalePulse);

                // Fade in
                if (this.opacity < 0.7) { // Higher max opacity
                    this.opacity += 0.02; // Faster fade in
                }

                // Reset if off screen
                if (this.y < -50) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.scale(this.currentScale, this.currentScale);

                // Add glow effect
                ctx.shadowBlur = 15 * this.glowIntensity;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                ctx.globalAlpha = this.opacity;

                // Main text
                ctx.font = '32px Arial'; // Bigger font
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; // Brighter white
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, 0, 0);

                // Add subtle color overlay
                ctx.globalAlpha = this.opacity * 0.3;
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
                gradient.addColorStop(0, 'rgba(135, 206, 235, 0.8)'); // Sky blue
                gradient.addColorStop(1, 'rgba(70, 130, 180, 0)'); // Steel blue
                ctx.fillStyle = gradient;
                ctx.fillText(this.text, 0, 0);

                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            notes.forEach(note => {
                note.update();
                note.draw();
            });

            animationFrameId = requestAnimationFrame(animate);
        }

        // Initialize notes and start animation
        function initializeNotes() {
            // Create initial batch of notes
            for (let i = 0; i < 20; i++) { // More initial notes
                notes.push(new Note());
            }

            // Start animation
            animate();

            // Periodically add new notes
            setInterval(() => {
                if (notes.length < 40 && Math.random() < 0.2) { // More max notes and higher spawn rate
                    notes.push(new Note());
                }
            }, 1500); // Shorter interval between spawns
        }

        // Start the animation immediately
        initializeNotes();
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
