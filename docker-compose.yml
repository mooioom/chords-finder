version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-app
    ports:
      - "5020:5020"
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./config.py:/app/config.py
      - ./run.py:/app/run.py
      - app-uploads:/app/app/static/uploads
    environment:
      - FLASK_ENV=development
      - FLASK_APP=run.py
      - PYTHONPATH=/app
      - FLASK_RUN_PORT=5020
    command: python -m flask run --host=0.0.0.0 --port=5020
    networks:
      - app-network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./tests:/app/tests
      - ./config.py:/app/config.py
      - ./run.py:/app/run.py
      - test-uploads:/app/app/static/uploads
    environment:
      - FLASK_ENV=testing
      - FLASK_APP=run.py
      - PYTHONPATH=/app
      - FLASK_RUN_PORT=5020
    depends_on:
      - app

volumes:
  app-uploads:
  test-uploads: 

networks:
  app-network:
    external: true